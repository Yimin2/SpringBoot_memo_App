<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">

<div layout:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">할일 목록</h1>
        <a href="/todos/new" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600">새 할일 추가</a>
    </div>

	<div th:if="${message}" role="alert" class="alert alert-success mb-4">
		<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
		</svg>
		<span th:text="${message}"></span>
	</div>

	<div class="hover-3d">
		<!-- content -->
		<figure class="w-60 rounded-2xl">
			<img src="https://img.daisyui.com/images/stock/card-1.webp?x" alt="Tailwind CSS 3D card" />
		</figure>
		<!-- 8 empty divs needed for the 3D effect -->
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>

	<div class="hover-3d">
		<!-- content -->
		<figure class="w-60 rounded-2xl">
			<img src="https://img.daisyui.com/images/stock/card-2.webp?x" alt="Tailwind CSS 3D hover" />
		</figure>
		<!-- 8 empty divs needed for the 3D effect -->
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>

	<div class="hover-3d">
		<!-- content -->
		<figure class="w-60 rounded-2xl">
			<img src="https://img.daisyui.com/images/stock/card-3.webp?x" alt="Tailwind CSS 3D hover" />
		</figure>
		<!-- 8 empty divs needed for the 3D effect -->
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>


    <div class="bg-white p-4 rounded-lg shadow-md mb-4 mt-4 flex">
	    <div class="join">
		    <button class="btn join-item btn-ghost"><a href="/todos">전체</a></button>
		    <span th:text="${totalCount}"></span>
		    <button class="btn join-item btn-ghost"><a href="/todos/active">진행중</a></button>
		    <span th:text="${activeCount}"></span>
		    <button class="btn join-item btn-ghost"><a href="/todos/completed">완료</a></button>
		    <span th:text="${completedCount}"></span>
	    </div>
	    <button class="btn btn-ghost"><a href="/todos/delete-completed">완료된 할일 삭제</a></button>
    </div>

    <div class="bg-white rounded-lg shadow-md">
        <div class="p-4">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/12">ID</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-7/12">제목</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-2/12">상태</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-2/12">작업</th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="todo : ${todos}" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${todo.id}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${todo.title}"></td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span th:if="${todo.completed}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">완료</span>
                        <span th:unless="${todo.completed}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">진행중</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <a th:href="@{/todos/{id}(id=${todo.id})}" class="text-indigo-600 hover:text-indigo-900">
                            상세보기
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</html>
