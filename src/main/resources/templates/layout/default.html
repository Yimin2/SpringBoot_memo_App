<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 text-gray-800">
<nav class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-2 flex justify-between items-center">
        <a class="text-xl font-bold text-blue-600" href="/todos">Todo App</a>
        <div class="flex space-x-4">
            <a class="text-gray-600 hover:text-blue-500" href="/todos">Home</a>
            <a class="text-gray-600 hover:text-blue-500" href="/todos/new">New</a>
        </div>
        <form action="/todos/search" class="flex">
            <input type="text" name="keyword" class="border rounded-l-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="검색...">
            <button type="submit" class="bg-blue-500 text-white px-4 py-1 rounded-r-md hover:bg-blue-600">검색</button>
        </form>
    </div>
</nav>

<div class="container mx-auto p-4">
    <div layout:fragment="content">

    </div>
</div>

</body>
</html>
