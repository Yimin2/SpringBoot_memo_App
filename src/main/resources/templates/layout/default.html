<!DOCTYPE html>
<html
		lang="en"
		xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<title>Todo App</title>
	<link
			href="/css/output.css"
			rel="stylesheet"/>

</head>
<body class="bg-gray-100 text-gray-800">
	<div class="navbar bg-base-100 shadow-sm">
		<div class="flex-none">
			<a class="btn btn-ghost text-xl" href="/todos">Todo App</a>
		</div>
		<div class="flex-1">
			<ul class="menu menu-horizontal px-1">
				<li><a href="/todos">Home</a></li>
				<li><a href="/todos/new">New</a></li>
			</ul>
		</div>
		<div class="flex justify-end">
			<form
					action="/todos/search"
					class="flex">
				<input type="text" name="keyword" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
				<button class="btn btn-ghost btn-circle">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /> </svg>
				</button>
			</form>
		</div>
	</div>

	<div role="alert" class="alert alert-error" th:if="${error}">
		<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
			<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
		</svg>
		<span th:text="${error}"></span>
	</div>

	<div class="container mx-auto p-4">
		<div layout:fragment="content">

		</div>
	</div>

</body>
</html>
